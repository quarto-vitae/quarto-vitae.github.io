project:
  type: website
  pre-render: scripts/generate-templates.sh

website:
  title: "Quarto Vitae"
  description: "Quarto extensions for writing CVs and résumés."
  site-url: "https://quarto-vitae.github.io"
  # Writes llms.txt and a plain-markdown <page>.llms.md beside each page, which
  # can carry agent-only content (`.content-visible when-format="llms-txt"`).
  llms-txt: true
  repo-url: "https://github.com/quarto-vitae/quarto-vitae.github.io"
  repo-actions: [issue]
  open-graph:
    image: images/opengraph.png
  twitter-card:
    image: images/opengraph.png
  page-navigation: true
  navbar:
    background: white
    foreground: black
    logo: images/vitae-hex.svg
    logo-alt: "Quarto Vitae"
    left:
      - href: index.qmd
        text: Home
      - href: templates.qmd
        text: Templates
      - href: using-templates.qmd
        text: Writing a CV
      - href: migration.qmd
        text: Migrating from R Markdown
      - href: creating-templates.qmd
        text: Creating Templates
    right:
      - icon: github
        href: https://github.com/orgs/quarto-vitae/repositories
        aria-label: Quarto Vitae templates on GitHub

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    include-in-header: _plausible.html
    toc: true

filters:
  # Agent-only checklists survive the llms.txt markdown conversion.
  # Runs before Quarto parses `.content-visible` divs, whose agent-only
  # content user filters would otherwise never see.
  - at: pre-ast
    path: filters/llms-task-lists.lua
